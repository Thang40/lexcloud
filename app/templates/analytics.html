{% extends "base.html" %}

{% block title %}Analytics - LexCloud{% endblock %}

{% block extra_css %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-12">
        <h2 class="mb-4">Analytics Dashboard</h2>
    </div>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Documents by Contract Type</h5>
                <canvas id="contractTypeChart"></canvas>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Monthly Upload Trend</h5>
                <canvas id="monthlyChart"></canvas>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
    fetch('{{ url_for("analytics.analytics_data") }}')
        .then(response => response.json())
        .then(data => {
            // Contract Type Chart
            const ctxContractType = document.getElementById('contractTypeChart').getContext('2d');
            new Chart(ctxContractType, {
                type: 'doughnut',
                data: {
                    labels: data.contract_types.labels,
                    datasets: [{
                        data: data.contract_types.data,
                        backgroundColor: [
                            '#0d6efd',
                            '#198754',
                            '#fd7e14',
                            '#dc3545',
                            '#6c757d',
                            '#0dcaf0'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });

            // Monthly Chart
            const ctxMonthly = document.getElementById('monthlyChart').getContext('2d');
            new Chart(ctxMonthly, {
                type: 'line',
                data: {
                    labels: data.monthly.labels,
                    datasets: [{
                        label: 'Documents Uploaded',
                        data: data.monthly.data,
                        borderColor: '#0d6efd',
                        backgroundColor: 'rgba(13, 110, 253, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'top'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        })
        .catch(error => {
            console.error('Error loading analytics:', error);
            alert('Failed to load analytics data');
        });
</script>
{% endblock %}
