{% extends "base.html" %}

{% block title %}Upload Document - LexCloud{% endblock %}

{% block content %}
<div class="welcome-section">
    <h1 class="welcome-title">Upload Document</h1>
    <p class="welcome-subtitle">Add a new legal document for analysis and metadata extraction</p>
</div>

<div class="card">
    <form method="POST" enctype="multipart/form-data">
        <!-- File Upload Area -->
        <div class="form-group">
            <label for="file">Select File</label>
            <div class="upload-area" onclick="document.getElementById('file').click();" id="uploadArea">
                <div class="upload-icon">📎</div>
                <div class="upload-title">Click to upload or drag and drop</div>
                <div class="upload-subtitle">PDF, PNG, JPG, DOCX (max 50MB)</div>
            </div>
            <input type="file" id="file" name="file" accept=".pdf,.png,.jpg,.jpeg,.docx" style="display:none;" required>
        </div>

        <!-- Contract Type -->
        <div class="form-group">
            <label for="contract_type">Contract Type</label>
            <select id="contract_type" name="contract_type" required>
                <option value="">Select a contract type...</option>
                <option value="NDA">Non-Disclosure Agreement (NDA)</option>
                <option value="Employment">Employment Contract</option>
                <option value="Service Agreement">Service Agreement</option>
                <option value="Lease Agreement">Lease Agreement</option>
                <option value="Purchase Agreement">Purchase Agreement</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <!-- Client Name -->
        <div class="form-group">
            <label for="client_name">Client Name</label>
            <input type="text" id="client_name" name="client_name" placeholder="Enter client or company name" required>
        </div>

        <!-- Buttons -->
        <div class="btn-group">
            <button type="submit" class="btn btn-primary btn-block">Upload Document</button>
            <button type="reset" class="btn btn-secondary btn-block">Clear</button>
        </div>
    </form>
</div>

<script>
// Drag and drop functionality
const uploadArea = document.getElementById('uploadArea');
const fileInput = document.getElementById('file');

uploadArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadArea.classList.add('dragover');
});

uploadArea.addEventListener('dragleave', () => {
    uploadArea.classList.remove('dragover');
});

uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    
    if (e.dataTransfer.files.length) {
        fileInput.files = e.dataTransfer.files;
        // Show file name
        const fileName = e.dataTransfer.files[0].name;
        document.querySelector('.upload-title').textContent = fileName;
    }
});

// Show file name when selected
fileInput.addEventListener('change', () => {
    if (fileInput.files.length) {
        const fileName = fileInput.files[0].name;
        document.querySelector('.upload-title').textContent = fileName;
    }
});
</script>
{% endblock %}
