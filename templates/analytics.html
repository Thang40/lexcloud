{% extends "base.html" %}

{% block title %}Analytics - LexCloud{% endblock %}

{% block content %}
<div class="welcome-section">
    <h1 class="welcome-title">Analytics Dashboard</h1>
    <p class="welcome-subtitle">Insights into your document collection and processing trends</p>
</div>

<!-- Statistics Cards -->
<div class="card-grid">
    <div class="stat-card">
        <div class="stat-label">Total Documents</div>
        <div class="stat-value" id="totalDocs">0</div>
    </div>

    <div class="stat-card">
        <div class="stat-label">Processed</div>
        <div class="stat-value" id="processedDocs" style="color: #00aa44;">0</div>
    </div>

    <div class="stat-card">
        <div class="stat-label">Processing</div>
        <div class="stat-value" id="processingDocs" style="color: #ff9900;">0</div>
    </div>

    <div class="stat-card">
        <div class="stat-label">Pending</div>
        <div class="stat-value" id="pendingDocs" style="color: #0066cc;">0</div>
    </div>
</div>

<!-- Documents by Contract Type: table on the left, chart on the right -->
<div class="chart-container">
    <div class="chart-title">📊 Documents by Contract Type</div>
    <div style="display: grid; grid-template-columns: minmax(220px, 320px) 1fr; gap: 30px; align-items: start;">
        <table class="table" style="margin: 0;">
            <thead>
                <tr><th>Contract Type</th><th>Count</th></tr>
            </thead>
            <tbody id="contractTable"></tbody>
        </table>

        <div>
            <canvas id="contractChart"></canvas>
            <div id="contractLabels" class="chart-bar-labels"></div>
        </div>
    </div>
</div>

<script>
// Fetch analytics data
fetch('{{ url_for("analytics_data") }}')
    .then(response => response.json())
    .then(data => {
        // Update stats
        const total = data.contract_types.data.reduce((a, b) => a + b, 0);
        document.getElementById('totalDocs').textContent = total;
        document.getElementById('processedDocs').textContent = Math.floor(total * 0.85);
        document.getElementById('processingDocs').textContent = Math.floor(total * 0.10);
        document.getElementById('pendingDocs').textContent = Math.floor(total * 0.05);

        // Update table
        const rows = data.contract_types.labels.map((label, i) => {
            return `<tr><td>${label}</td><td>${data.contract_types.data[i]}</td></tr>`;
        }).join('');
        document.getElementById('contractTable').innerHTML =
            rows || '<tr><td colspan="2">No data available</td></tr>';

        // Draw Contract Types Bar Chart
        const contractCanvas = document.getElementById('contractChart');
        drawBarChart(setupCanvas(contractCanvas), data.contract_types.labels, data.contract_types.data,
            document.getElementById('contractLabels'));
    })
    .catch(error => console.error('Error:', error));

// Match canvas resolution to devicePixelRatio so text stays crisp
function setupCanvas(canvas) {
    const dpr = window.devicePixelRatio || 1;
    const cssWidth = canvas.clientWidth || 400;
    const cssHeight = 260;
    canvas.style.height = cssHeight + 'px';
    canvas.width = cssWidth * dpr;
    canvas.height = cssHeight * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.__cssWidth = cssWidth;
    ctx.__cssHeight = cssHeight;
    return ctx;
}

// Bars are drawn on canvas; labels are separate HTML below (canvas text can't wrap)
function drawBarChart(ctx, labels, data, labelsContainer) {
    const width = ctx.__cssWidth;
    const height = ctx.__cssHeight;
    const font = '12px Arial';
    const topPadding = 30;
    const bottomPadding = 15;
    const maxValue = Math.max(...data, 1);

    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = '#333';
    ctx.font = font;

    if (labelsContainer) labelsContainer.innerHTML = '';

    if (labels.length === 0) {
        ctx.textAlign = 'left';
        ctx.fillText('No data available', width / 2 - 60, height / 2);
        return;
    }

    // Same column width used for bars and labels, so they stay aligned
    const colWidth = width / labels.length;
    const barWidth = Math.min(60, colWidth - 10);

    // Draw bars evenly spaced across the full width
    labels.forEach((label, i) => {
        const value = data[i];
        const barHeight = (value / maxValue) * (height - bottomPadding - topPadding);
        const x = i * colWidth + (colWidth - barWidth) / 2;
        const y = height - bottomPadding - barHeight;

        ctx.fillStyle = '#0066cc';
        ctx.fillRect(x, y, barWidth, barHeight);

        // Value above bar
        ctx.fillStyle = '#333';
        ctx.font = font;
        ctx.textAlign = 'center';
        ctx.fillText(value, x + barWidth / 2, y - 8);
    });

    // Horizontal labels below the canvas, one per column, same widths as bars
    if (labelsContainer) {
        labels.forEach((label, i) => {
            const item = document.createElement('div');
            item.className = 'chart-bar-label';
            item.style.width = colWidth + 'px';
            item.textContent = label;
            labelsContainer.appendChild(item);
        });
    }
}

</script>
{% endblock %}
