{% extends "base.html" %}

{% block title %}Page Not Found - LexCloud{% endblock %}

{% block content %}
<div style="text-align: center; padding: 60px 20px;">
    <div style="font-size: 64px; margin-bottom: 20px;">😕</div>
    <h1 style="font-size: 32px; margin-bottom: 10px; color: #333;">Page Not Found</h1>
    <p style="font-size: 16px; color: #666; margin-bottom: 30px;">The page you're looking for doesn't exist.</p>
    
    <a href="{{ url_for('login') if not session.get('email') else url_for('dashboard') }}" class="btn btn-primary">
        Go {{ "to Login" if not session.get('email') else "to Dashboard" }}
    </a>
</div>
{% endblock %}
