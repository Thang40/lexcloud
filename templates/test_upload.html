<!DOCTYPE html>
<html>
<head>
    <title>Debug Upload Test</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        .form-group { margin: 15px 0; }
        input, select, textarea { width: 300px; padding: 8px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        .result { margin-top: 20px; padding: 15px; border: 1px solid #ccc; white-space: pre-wrap; font-family: monospace; }
        .error { background: #f8d7da; color: #721c24; }
        .success { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <h1>Debug Upload Test</h1>

    <form id="uploadForm">
        <div class="form-group">
            <label>File:</label><br>
            <input type="file" id="file" name="file" required>
        </div>

        <div class="form-group">
            <label>Contract Type:</label><br>
            <select name="contract_type" required>
                <option value="">Select...</option>
                <option value="NDA">NDA</option>
                <option value="Employment">Employment</option>
                <option value="Service Agreement">Service Agreement</option>
            </select>
        </div>

        <div class="form-group">
            <label>Client Name:</label><br>
            <input type="text" name="client_name" placeholder="e.g. Acme Corp" required>
        </div>

        <button type="submit">Test Upload</button>
    </form>

    <div id="result" class="result" style="display:none;"></div>

    <script>
        document.getElementById('uploadForm').onsubmit = async (e) => {
            e.preventDefault();

            const formData = new FormData(document.getElementById('uploadForm'));
            const resultDiv = document.getElementById('result');

            try {
                const response = await fetch('/api/debug/test-upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                resultDiv.className = 'result ' + (response.ok ? 'success' : 'error');
                resultDiv.textContent = JSON.stringify(data, null, 2);
                resultDiv.style.display = 'block';

            } catch (err) {
                resultDiv.className = 'result error';
                resultDiv.textContent = 'Error: ' + err.message;
                resultDiv.style.display = 'block';
            }
        };
    </script>
</body>
</html>
